    <text x="72" y="262" fill="#f7efdf" font-family="Pretendard, Arial, sans-serif" font-size="25" font-weight="700">상담 전 준비 체크</text>
    <text x="72" y="300" fill="#ead7b7" font-family="Pretendard, Arial, sans-serif" font-size="19">채무 · 소득 · 재산 · 양육 자료</text>
