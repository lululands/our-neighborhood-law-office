    <text x="120" y="165" fill="#eab26c" font-size="27" font-weight="800" letter-spacing="4">우리동네 법률사무소 · 지역 법률정보</text>
    <text x="120" y="305" fill="#fffaf0" font-size="75" font-weight="800" letter-spacing="-4">채무 부담과 이혼 분쟁,</text>
