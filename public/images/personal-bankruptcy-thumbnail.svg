    <rect x="62" y="364" width="266" height="20" rx="6" fill="#173149"/>
    <g transform="translate(133 407)" stroke="#244761" stroke-width="8" stroke-linecap="round" fill="none"><path d="M62 0v45M15 15h94M32 15L9 54h46zM92 15L69 54h46z"/></g>
