  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17293f"/><stop offset="1" stop-color="#355d78"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcfe"/><stop offset="1" stop-color="#dce5ec"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#091523" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="70" r="250" fill="#ffffff" opacity=".05"/>
  <circle cx="1020" cy="640" r="300" fill="#7ca3bd" opacity=".13"/>
  <g transform="translate(72 92)">
