    <rect x="28" y="30" width="76" height="6" rx="3" fill="#d5b676"/>
    <text x="28" y="105" fill="#d5b676" font-family="Arial, Noto Sans KR, sans-serif" font-size="25" font-weight="700">우리동네 법률사무소</text>
    <text x="28" y="180" fill="#ffffff" font-family="Arial, Noto Sans KR, sans-serif" font-size="54" font-weight="800">개인파산 · 면책</text>
    <text x="28" y="244" fill="#ffffff" font-family="Arial, Noto Sans KR, sans-serif" font-size="40" font-weight="700">법률정보</text>
    <line x1="28" y1="292" x2="465" y2="292" stroke="#789bb3"/>
    <text x="28" y="352" fill="#dde6ed" font-family="Arial, Noto Sans KR, sans-serif" font-size="27">채무 · 재산 · 소득</text>
    <text x="28" y="398" fill="#dde6ed" font-family="Arial, Noto Sans KR, sans-serif" font-size="27">면책절차와 준비자료</text>
    <text x="28" y="458" fill="#a8c0d0" font-family="Arial, Noto Sans KR, sans-serif" font-size="19">사실관계와 자료부터 확인하세요</text>
