    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbfa"/><stop offset="1" stop-color="#dceceb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#061a20" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1070" cy="85" r="230" fill="#ffffff" opacity=".05"/>
  <circle cx="1055" cy="620" r="300" fill="#63b3aa" opacity=".12"/>
  <g transform="translate(72 92)">
