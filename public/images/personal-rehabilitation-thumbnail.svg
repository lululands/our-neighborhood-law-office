    <text x="28" y="185" fill="#ffffff" font-family="Arial, Noto Sans KR, sans-serif" font-size="58" font-weight="800">개인회생</text>
    <text x="28" y="250" fill="#ffffff" font-family="Arial, Noto Sans KR, sans-serif" font-size="42" font-weight="700">법률정보</text>
    <line x1="28" y1="292" x2="465" y2="292" stroke="#6ea7a4"/>
    <text x="28" y="352" fill="#d8e8e6" font-family="Arial, Noto Sans KR, sans-serif" font-size="27">채무 · 소득 · 재산</text>
    <text x="28" y="398" fill="#d8e8e6" font-family="Arial, Noto Sans KR, sans-serif" font-size="27">변제계획과 준비자료</text>
