[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/posts/:id"
  to = "/.netlify/functions/article?id=:id"
  status = 200
  force = false

[[redirects]]
  from = "/uploads/:id"
  to = "/.netlify/functions/article-image?id=:id"
  status = 200

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 이전 이혼소송 주소는 현재 이혼전문변호사 분야로 연결합니다.
[[redirects]]
  from = "/category/divorce-lawsuit"
  to = "/category/divorce-lawyer"
  status = 301
  force = true
